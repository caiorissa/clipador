<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Clipador{% endblock %} · Clipador</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">✂ Clipador</a>
    <nav>
      {% set path = request.url.path %}
      <a href="/fontes" class="{{ 'active' if path.startswith('/fontes') }}">Fontes</a>
      <a href="/revisao" class="{{ 'active' if path.startswith('/revisao') }}">Revisão</a>
      <a href="/streamers"class="{{ 'active' if path.startswith('/streamers') }}">Streamers</a>
      <a href="/jobs" class="{{ 'active' if path.startswith('/jobs') }}">Jobs</a>
      <a href="/sistema" class="{{ 'active' if path.startswith('/sistema') }}">Sistema</a>
    </nav>
  </header>
  <main class="{% block main_class %}{% endblock %}">
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
