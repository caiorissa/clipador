# Palavras e expressões de empolgação usadas pelo Clipador para pontuar momentos.
#
# Este arquivo é copiado para data/hype_words.toml na primeira análise; edite a cópia em data/.
# Formato:  "palavra ou expressão" = peso   (peso 1.0 = normal; 0.3 = fraco; 2.0 = forte)
# O casamento ignora acentos e maiúsculas e é por palavra inteira ("tiro" não casa "retirou").
#
# Evite palavras genéricas que aparecem em toda frase ("cara", "gente", "mano", "velho",
# "tipo", "né", "aí"): elas não indicam um momento bom e só geram ruído. Elas estão na seção
# [ignorar] só como lembrete; não são usadas.

