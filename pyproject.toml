[project]
name = "clipador"
version = "0.1.0"
description = "Transforma VODs de streamers em clips verticais legendados (Shorts, TikTok, Reels)."
readme = "README.md"
requires-python = ">=3.11"  # pinned to 3.12 in .python-version (ctranslate2 wheels)
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "yt-dlp[default]>=2026.1.1",  # [default] brings yt-dlp-ejs (YouTube JS challenge solver)
    "numpy>=2.0",
    "scipy>=1.14",
    "faster-whisper>=1.1",
    # facecam auto-detection (YuNet / Haar), CPU only. <5: OpenCV 5 dropped CascadeClassifier
    # (the offline Haar fallback).
    "opencv-python-headless>=4.10,<5",
    # CUDA runtime libs for ctranslate2 (GPU Whisper) without a system-wide CUDA/cuDNN install.
    "nvidia-cublas-cu12; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9,<10; sys_platform != 'darwin'",
]

[project.scripts]
clipador = "clipador.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Make the resolver pick NVIDIA lib versions that ship Windows wheels.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/clipador"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # PT-BR text has accented chars and typographic quotes

[tool.ruff.lint.per-file-ignores]
"src/clipador/migrations/versions/*.py" = ["E501"]
# E501: long literal tool outputs / URLs. F811: pytest fixtures imported from other test modules.
"tests/*.py" = ["E501", "F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
